name: flagship

services:
  flagship:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${FLAGSHIP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Flagship: Host=postgres;Port=5432;Database=${POSTGRES_DB:-flagship};Username=${POSTGRES_USER:-flagship};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Flagship__Admin__Email: ${FLAGSHIP_ADMIN_EMAIL:-admin@flagship.local}
      Flagship__Admin__Password: ${FLAGSHIP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flagship}
      POSTGRES_USER: ${POSTGRES_USER:-flagship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - flagship-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagship} -d ${POSTGRES_DB:-flagship}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flagship-postgres:
